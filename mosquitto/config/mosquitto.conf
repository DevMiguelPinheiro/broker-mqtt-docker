# Mosquitto configuration file for local testing
# Allow anonymous connections (no authentication required)
allow_anonymous true

# MQTT listener on port 1883
listener 1883

# WebSocket listener on port 9001
listener 9001
protocol websockets

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all
